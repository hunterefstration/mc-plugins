name: EffectBooks
version: '${version}'
main: dev.effectbooks.EffectBooksPlugin
api-version: '1.21'
description: Holders write player names in a glowing book to grant them a permanent potion effect.
commands:
  effectbooks:
    description: Open the Effect Books admin menu.
    aliases: [eb, effectbook]
    permission: effectbooks.admin
    usage: /<command> [reload|list|add|delete|help]
permissions:
  effectbooks.admin:
    description: Manage effect books.
    default: op
