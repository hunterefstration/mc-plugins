# ------------------------------------------------------------------
#  EffectBooks
# ------------------------------------------------------------------
# List book holders and the effect their book grants.
#
# A holder's glowing "Book of <Effect>" shows in the output slot of the crafting
# grid in their inventory (it doesn't take up an inventory slot). Clicking it, or
# typing /book, puts it in their hand to write in.
# Every player name they write in it (one name per line) gets that effect
# permanently: milk, death, totems and /effect clear will not remove it.
# Erasing a name from the book removes the effect from that player.
#
# Format:   <holder username>: <EFFECT>[:level]
# A holder can own several books by using a list.
#
# Effect names are the vanilla ids, for example:
#   SPEED, SLOWNESS, HASTE, MINING_FATIGUE, STRENGTH, JUMP_BOOST, REGENERATION,
#   RESISTANCE, FIRE_RESISTANCE, WATER_BREATHING, INVISIBILITY, NIGHT_VISION,
#   HEALTH_BOOST, ABSORPTION, SATURATION, GLOWING, LUCK, SLOW_FALLING,
#   CONDUIT_POWER, DOLPHINS_GRACE, HERO_OF_THE_VILLAGE, WEAKNESS, POISON ...
#   INSTANT_HEALTH, INSTANT_DAMAGE, LEVITATION, DARKNESS, BAD_OMEN ...
# Instant effects can't last forever, so INSTANT_HEALTH / INSTANT_DAMAGE give
# one dose every check (every 2 seconds by default). INSTANT_DAMAGE can kill!
#
# Everything here can also be managed in-game with /eb (ops only).
# After editing this file by hand, run /eb reload.
#
# Example:
#   books:
#     Steve: SPEED
#     Alex: STRENGTH:2
#     Notch:
#       - NIGHT_VISION
#       - HASTE:2
books: {}

# How often (in ticks, 20 = 1 second) books and effects are re-checked.
check-interval-ticks: 40

# Show potion swirl particles on players who have a book effect.
show-particles: false

# Show the effect icon in the top-right of the screen.
show-icon: true
